<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Confirm Delete</title>
</head>

<body>

    <h1>DELETE FOOTBALL CLUB</h1>

    <p>Are you sure you want to delete {{ club.club_name }}?</p>

    <form method="POST">
        {% csrf_token %}

        <button type="submit">YES, DELETE</button>
    </form>

    <a href="{% url 'club' %}">CANCEL</a>

</body>

</html>
