<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Delete Fixture</title>
</head>

<body>

    <h1>DELETE FIXTURE</h1>

    <p>Are you sure you want to delete this fixture?</p>

    <h3>{{ fixture.home_club }} vs {{ fixture.away_club }}</h3>

    <form method="POST">
        {% csrf_token %}

        <button type="submit">YES, DELETE FIXTURE</button>

    </form>

    <br>

    <a href="{% url 'matchfixture' %}">CANCEL</a>

</body>

</html>
