<!DOCTYPE html>
<html lang="en">

<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DELETE RESULT</title>
</head>

<body>

    <h1>DELETE RESULT DETAILS</h1>

    <p>Are you sure you want to delete this result?</p>

    <p>
        <strong>Goals Scored:</strong>
        {{ result.goals_scored }}
    </p>

    <p>
        <strong>Goals Conceded:</strong>
        {{ result.goals_conceded }}
    </p>

    <form method="POST">
        {% csrf_token %}

        <button type="submit">YES, DELETE RESULT</button>

    </form>

    <br>

    <a href="{% url 'results' %}">CANCEL</a>

</body>

</html>
