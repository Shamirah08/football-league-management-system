<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDIT SEASON</title>
</head>

<body>

    <h1>EDIT SEASON DETAILS</h1>

    <form method="POST">
        {% csrf_token %}

        <label>START DATE</label><br>
        <input type="date" name="start_date" value="{{ season.start_date|date:'Y-m-d' }}" required>
        <br><br>

        <label>END DATE</label><br>
        <input type="date" name="end_date" value="{{ season.end_date|date:'Y-m-d' }}" required>
        <br><br>

        <button type="submit">Update Season</button>

    </form>

    <br>
    <a href="{% url 'season' %}">Back to Seasons</a>

</body>

</html>
