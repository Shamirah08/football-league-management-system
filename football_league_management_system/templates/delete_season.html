<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DELETE SEASON</title>
</head>

<body>

    <h1>DELETE SEASON</h1>

    <p>Are you sure you want to delete this season?</p>

    <p>
        Season: {{ season.start_date|date:"Y" }}/{{ season.end_date|date:"y" }}
    </p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
    </form>

    <br>

    <a href="{% url 'season' %}">Cancel</a>

</body>

</html>
