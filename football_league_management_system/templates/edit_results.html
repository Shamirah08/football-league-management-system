<!DOCTYPE html>
<html lang="en">

<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDIT RESULTS</title>
</head>

<body>

    <h1>EDIT RESULTS DETAILS</h1>

    <form method="POST">
        {% csrf_token %}

        <label>FIXTURE:</label>
        <select name="fixture" id="fixture" required>

            {% for fixture in fixtures %}
            <option value="{{ fixture.id }}">
                {{ fixture }}
            </option>
            {% endfor %}

        </select>

        <br><br>

        <label>SEASON:</label>
        <select name="season" id="season" required>

            {% for season in seasons %}
            <option value="{{ season.id }}">
                {{ season }}
            </option>
            {% endfor %}

        </select>

        <br><br>

        <label>GOALS SCORED:</label>
        <input type="number" name="goals_scored" value="{{ result.goals_scored }}" required>

        <br><br>

        <label>GOALS CONCEDED:</label>
        <input type="number" name="goals_conceded" value="{{ result.goals_conceded }}" required>

        <br><br>

        <button type="submit">UPDATE RESULT</button>

    </form>

    <br>

    <a href="{% url 'results' %}">BACK TO RESULTS</a>

    <script>
        document.getElementById("fixture").value = "{{ result.fixture_id }}";
        document.getElementById("season").value = "{{ result.season_id }}";
    </script>

</body>

</html>
